# ============================================================================
# MEDIA SCOPE IT LTD — NGINX PRODUCTION REVERSE PROXY CONFIGURATION TEMPLATE
# Target Server OS: Ubuntu 22.04 LTS / Hostinger VPS
# ============================================================================

# HTTP to HTTPS Automatic Redirect
server {
    listen 80;
    listen [::]:80;
    server_name mediascopeit.com www.mediascopeit.com;

    return 301 https://$host$request_uri;
}

# HTTPS Server Block (Let's Encrypt / Certbot SSL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mediascopeit.com www.mediascopeit.com;

    # SSL Certificate Paths (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/mediascopeit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediascopeit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Maximum Upload Body Size (Media Library & Attachments)
    client_max_body_size 20M;

    # Frontend Static Distribution Directory (Vite build dist)
    root /var/www/mediascopeit/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA Clean URL Routing (Prevents 404 Not Found on Hard Refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static JS/CSS Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API Proxy (Forwarding to Express Server on Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploaded Static Media Files Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Gzip Compression Configuration
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
