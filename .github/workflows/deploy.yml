name: Deploy Media Scope Website


on:
  push:
    branches:
      - main


jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/mediascope/Company-Website || exit 1
            git fetch origin main
            git reset --hard origin/main
            npm run build
            rm -rf /home/mediascope/htdocs/mediascopeit.com/*
            cp -a dist/. /home/mediascope/htdocs/mediascopeit.com/
            cd /home/mediascope/Company-Website/backend || exit 1
            npm install --omit=dev || true
            pm2 restart all || pm2 reload all || true
            su - mediascope -c "pm2 restart all || pm2 reload all || true" || true
            sudo -u mediascope pm2 restart all || true
            systemctl restart pm2-mediascope || systemctl restart pm2-root || true
            nginx -t && systemctl reload nginx || true
